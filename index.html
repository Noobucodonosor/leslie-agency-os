<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leslie — Agency OS (Demo Interattiva)</title>
  <meta name="description" content="Piattaforma B2B di scouting autonomo SSE, qualificazione AI (DeepSeek) e CRM multi-tenant per nautica, ospitalità ed esperienze premium.">
  <meta property="og:title" content="Leslie — Agency OS">
  <meta property="og:description" content="Scouting autonomo SSE, qualificazione AI e CRM multi-tenant.">
  <meta property="og:image" content="https://raw.githubusercontent.com/Noobucodonosor/leslie-agency-os/main/docs/preview/social-preview.png">
  <meta name="twitter:card" content="summary_large_image">
  <style>
    :root {
      --bg: #070e1d;
      --sidebar: #0b1426;
      --card: #0e192f;
      --card-border: rgba(148, 163, 184, 0.14);
      --gold: #dfb25b;
      --gold-soft: rgba(223, 178, 91, 0.12);
      --ink: #f1f5f9;
      --muted: #94a3b8;
      --green: #34d399;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: grid;
      grid-template-columns: 248px 1fr;
    }
    aside {
      background: var(--sidebar);
      border-right: 1px solid var(--card-border);
      padding: 26px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: var(--gold);
      margin-bottom: 32px;
      padding: 0 8px;
    }
    .nav { display: flex; flex-direction: column; gap: 6px; }
    .nav button {
      background: transparent;
      border: 1px solid transparent;
      color: var(--muted);
      text-align: left;
      padding: 11px 14px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .nav button.active {
      background: rgba(255,255,255,0.05);
      border-color: var(--card-border);
      color: var(--ink);
      font-weight: 600;
    }
    .nav button .count {
      font-size: 11px;
      color: var(--gold);
      background: var(--gold-soft);
      padding: 2px 8px;
      border-radius: 999px;
    }
    .tenant {
      border: 1px solid var(--card-border);
      background: rgba(255,255,255,0.02);
      border-radius: 14px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .tenant-badge {
      width: 36px; height: 36px; border-radius: 10px;
      background: var(--gold); color: #0b1426;
      display: grid; place-items: center; font-weight: 800; font-size: 15px;
    }
    .tenant strong { display: block; font-size: 13px; }
    .tenant small { color: var(--muted); font-size: 11px; }
    main { padding: 36px 44px; max-width: 1180px; width: 100%; }
    header {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
      margin-bottom: 28px;
    }
    h1 { font-size: 30px; letter-spacing: -0.02em; margin-bottom: 6px; }
    .sub { color: var(--muted); font-size: 14px; }
    .cta {
      background: var(--gold); color: #0a1224; border: 0; border-radius: 999px;
      padding: 11px 22px; font-weight: 700; font-size: 14px; cursor: pointer;
      white-space: nowrap;
    }
    .cta:hover { filter: brightness(1.06); }
    .demo-banner {
      margin-bottom: 22px;
      padding: 11px 16px;
      border-radius: 12px;
      border: 1px solid rgba(223, 178, 91, 0.25);
      background: rgba(223, 178, 91, 0.07);
      font-size: 12.5px;
      color: #e2e8f0;
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
    }
    .demo-banner a { color: var(--gold); text-decoration: none; font-weight: 600; }
    .grid-2 { display: grid; grid-template-columns: 1.45fr 1fr; gap: 22px; }
    .panel {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 26px;
    }
    .pill {
      display: inline-block;
      font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
      color: var(--gold); background: var(--gold-soft);
      padding: 4px 10px; border-radius: 999px; margin-bottom: 12px;
    }
    .panel h2 { font-size: 20px; color: var(--gold); margin-bottom: 6px; }
    .panel p.hint { font-size: 13px; color: var(--muted); margin-bottom: 18px; }
    .niches { display: flex; flex-direction: column; gap: 10px; }
    .niche {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--card-border);
      color: var(--ink);
      padding: 13px 16px;
      border-radius: 12px;
      font-size: 13.5px;
      text-align: left;
      cursor: pointer;
      display: flex; justify-content: space-between; align-items: center;
    }
    .niche:hover, .niche.selected { border-color: var(--gold); background: rgba(223,178,91,0.08); }
    .niche span.score { font-size: 11px; color: var(--muted); font-family: ui-monospace, monospace; }
    .radar-box {
      min-height: 290px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center; gap: 14px;
    }
    .radar-ring {
      width: 68px; height: 68px; border-radius: 50%;
      border: 1px solid rgba(223,178,91,0.35);
      background: radial-gradient(circle, rgba(223,178,91,0.18), transparent 70%);
      display: grid; place-items: center; color: var(--gold); font-size: 20px;
    }
    .status-label { font-size: 11px; letter-spacing: 0.14em; color: var(--gold); font-weight: 700; }
    .log {
      width: 100%; text-align: left; font-family: ui-monospace, monospace; font-size: 12px;
      color: #cbd5e1; background: rgba(0,0,0,0.28); border-radius: 10px;
      padding: 12px; border: 1px solid var(--card-border); line-height: 1.6;
    }
    .log .ok { color: var(--green); }
    table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    th, td { text-align: left; padding: 12px 10px; border-bottom: 1px solid var(--card-border); }
    th { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; }
    .stage {
      display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 600;
      background: rgba(52,211,153,0.12); color: var(--green);
    }
    .stage.contacted { background: var(--gold-soft); color: var(--gold); }
    .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 20px; }
    .kpi { background: var(--card); border: 1px solid var(--card-border); border-radius: 14px; padding: 18px; }
    .kpi small { color: var(--muted); font-size: 12px; }
    .kpi strong { display: block; font-size: 26px; color: var(--gold); margin-top: 6px; }
    @media (max-width: 860px) {
      body { grid-template-columns: 1fr; }
      aside { border-right: 0; border-bottom: 1px solid var(--card-border); padding: 16px; }
      .brand { margin-bottom: 14px; }
      .nav { flex-direction: row; overflow-x: auto; }
      .tenant { display: none; }
      main { padding: 20px 16px; }
      header { flex-direction: column; }
      .grid-2, .kpis { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <aside>
    <div>
      <div class="brand">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="2.5"/><path d="M12 7.5V21M5 13a7 7 0 0 0 14 0M8 10h8"/></svg>
        LESLIE
      </div>
      <nav class="nav" id="nav">
        <button class="active" data-view="scout" type="button">Cerca Partner <span class="count">6</span></button>
        <button data-view="crm" type="button">I Miei Contatti <span class="count">4</span></button>
        <button data-view="overview" type="button">Panoramica</button>
      </nav>
    </div>
    <div class="tenant">
      <div class="tenant-badge">L</div>
      <div><strong>Demo Sandbox</strong><small>Nautica &amp; Ospitalità · Read-Only</small></div>
    </div>
  </aside>

  <main>
    <header>
      <div>
        <h1 id="page-title">Cerca Nuovi Partner</h1>
        <p class="sub" id="page-sub">Scouting autonomo SSE, estrazione contatti e scoring AI (DeepSeek) per partnership B2B.</p>
      </div>
      <button class="cta" id="btn-scan" type="button">Simula Scouting SSE</button>
    </header>

    <div class="demo-banner">
      <span><strong>Anteprima pubblica read-only:</strong> dati dimostrativi fittizi (nessun lead reale o chiave API esposta).</span>
      <a href="https://github.com/Noobucodonosor/leslie-agency-os" target="_blank" rel="noopener">Codice &amp; Wiki →</a>
    </div>

    <div id="view-root"></div>
  </main>

  <script>
    const niches = [
      { name: "Ville di lusso esclusive — Riviera Ligure", weight: "1.4×" },
      { name: "Boutique hotel & concierge — Tigullio", weight: "1.3×" },
      { name: "Wedding Planner — Portofino & Cinque Terre", weight: "1.2×" },
      { name: "Yacht Charter & Conciergerie Marittima", weight: "1.5×" },
      { name: "Luxury Tailor-Made Italy Tours", weight: "1.1×" },
      { name: "Esperienze Enogastronomiche Private", weight: "1.0×" }
    ];

    const demoLeads = [
      { org: "Villa Bellavista Concierge (Demo)", cat: "Boutique Hotel", score: "9.2 / 10", stage: "Partner", cls: "" },
      { org: "Riviera Charter Desk (Demo)", cat: "Nautica", score: "8.8 / 10", stage: "Contattato", cls: "contacted" },
      { org: "Atelier Eventi Golfo (Demo)", cat: "Wedding Planner", score: "8.5 / 10", stage: "Partner", cls: "" },
      { org: "Portofino Private Tours (Demo)", cat: "Esperienze", score: "8.1 / 10", stage: "Contattato", cls: "contacted" }
    ];

    let view = "scout";
    let selectedNiche = 0;
    let scanLines = [];

    function render() {
      const root = document.getElementById("view-root");
      if (view === "scout") {
        document.getElementById("page-title").textContent = "Cerca Nuovi Partner";
        document.getElementById("page-sub").textContent = "Trova hotel, wedding planner, concierge e agenzie con scouting autonomo SSE e scoring AI.";
        root.innerHTML = `
          <div class="grid-2">
            <section class="panel">
              <span class="pill">INTELLIGENCE ATTIVA</span>
              <h2>Settori Monitorati</h2>
              <p class="hint">Seleziona una nicchia pesata dal motore di apprendimento per simulare lo scouting.</p>
              <div class="niches">
                ${niches.map((n, i) => `
                  <button class="niche ${i === selectedNiche ? 'selected' : ''}" data-idx="${i}" type="button">
                    <span>${n.name}</span>
                    <span class="score">peso ${n.weight}</span>
                  </button>
                `).join("")}
              </div>
            </section>
            <section class="panel">
              <h2 style="color:var(--ink);font-size:18px;margin-bottom:6px">Ricerca Automatica (SSE)</h2>
              <p class="hint">Pipeline: Google Places → Scraper /about &amp; /team → DeepSeek Scoring 0–10 → SQLite WAL.</p>
              <div class="radar-box">
                <div class="radar-ring">◎</div>
                <div class="status-label">${scanLines.length ? 'SIMULAZIONE COMPLETATA' : 'READY TO SCAN'}</div>
                ${scanLines.length ? `<div class="log">${scanLines.join("<br>")}</div>` : `<p class="hint" style="margin:0">Clicca "Simula Scouting SSE" in alto per vedere il flusso di qualificazione.</p>`}
              </div>
            </section>
          </div>`;
        root.querySelectorAll(".niche").forEach(btn => {
          btn.onclick = () => { selectedNiche = Number(btn.dataset.idx); render(); };
        });
      } else if (view === "crm") {
        document.getElementById("page-title").textContent = "I Miei Contatti";
        document.getElementById("page-sub").textContent = "Funnel B2B isolato per tenant (saved → contacted → partner) con punteggio AI verificato.";
        root.innerHTML = `
          <section class="panel">
            <table>
              <thead><tr><th>Organizzazione (Dati Demo)</th><th>Settore</th><th>AI Score</th><th>Stato Funnel</th></tr></thead>
              <tbody>
                ${demoLeads.map(l => `
                  <tr>
                    <td><strong>${l.org}</strong></td>
                    <td style="color:var(--muted)">${l.cat}</td>
                    <td style="font-family:ui-monospace,monospace;color:var(--gold)">${l.score}</td>
                    <td><span class="stage ${l.cls}">${l.stage}</span></td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </section>`;
      } else {
        document.getElementById("page-title").textContent = "Panoramica Architettura";
        document.getElementById("page-sub").textContent = "Metriche operative e stack di produzione su Google Cloud Run (europe-west1).";
        root.innerHTML = `
          <div class="kpis">
            <div class="kpi"><small>Runtime Produzione</small><strong>Cloud Run</strong></div>
            <div class="kpi"><small>Persistenza</small><strong>SQLite WAL + GCS</strong></div>
            <div class="kpi"><small>Test End-to-End</small><strong>21 pytest</strong></div>
          </div>
          <section class="panel">
            <h2>Architettura End-to-End</h2>
            <p class="hint" style="margin-bottom:0;line-height:1.7">
              Backend <strong>Python 3.11 / Flask + Gunicorn</strong> (1 worker, 8 thread per coerenza SQLite WAL con sync asincrono su Google Cloud Storage).
              Motore <code>autonomous_scout.py</code> in streaming SSE, <code>scraper.py</code> per estrazione contatti da pagine statiche,
              <code>ai_analyzer.py</code> su DeepSeek con output JSON strutturato, e <code>commerce_engine.py</code> con portale partner dedicato.
            </p>
          </section>`;
      }
    }

    document.getElementById("nav").querySelectorAll("button").forEach(btn => {
      btn.onclick = () => {
        view = btn.dataset.view;
        document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("active", b === btn));
        render();
      };
    });

    document.getElementById("btn-scan").onclick = () => {
      view = "scout";
      document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("active", b.dataset.view === "scout"));
      const n = niches[selectedNiche].name;
      scanLines = [
        `[SSE] Query pool: "${n}"`,
        `[PLACES] 12 candidati individuati nell'area target`,
        `[SCRAPER] Estratte pagine /about e /team (filtri anti-rumore attivi)`,
        `<span class="ok">[DEEPSEEK] 3 lead qualificati con score ≥ 8.0 / 10 (modalità demo)</span>`
      ];
      render();
    };

    render();
  </script>
</body>
</html>
